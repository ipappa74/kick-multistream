<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick Multistream</title>
<link rel="apple-touch-icon" sizes="180x180" href="/kick-multistream/img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/kick-multistream/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/kick-multistream/img/favicon-16x16.png">
<link rel="icon" href="/kick-multistream/img/favicon.ico" sizes="any">

<style>
/* ───────────────────────────────────────────── */
/* GLOBAL RESET & BODY */
/* ───────────────────────────────────────────── */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  background: #0a0a0a;
  color: #eee;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ───────────────────────────────────────────── */
/* TOOLBAR */
/* ───────────────────────────────────────────── */

#toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  background: #111;
  border-bottom: 1px solid #222;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.logo {
  font-size: 13px;
  font-weight: 600;
  color: #5aff2f;
  letter-spacing: 0.05em;
}

.sub {
  font-size: 11px;
  color: #888;
}

.sep {
  flex: 1;
}

/* ───────────────────────────────────────────── */
/* LAYOUT BUTTONS */
/* ───────────────────────────────────────────── */

.layout-btns {
  display: flex;
  gap: 4px;
}

.lbtn {
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  border: 1px solid #2a2a2a;
  border-radius: 5px;
  background: #1a1a1a;
  color: #777;
  transition:
    background 0.15s ease,
    color 0.15s ease,
    border-color 0.15s ease;
}

.lbtn:hover {
  background: #222;
  color: #ccc;
}

.lbtn.active {
  background: #5aff2f;
  color: #0a0a0a;
  border-color: #5aff2f;
  font-weight: 600;
}

/* ───────────────────────────────────────────── */
/* FAVORITES */
/* ───────────────────────────────────────────── */

#fav-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: #0d0d0d;
  border-bottom: 1px solid #1a1a1a;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.fav-label {
  font-size: 10px;
  color: #888;
  white-space: nowrap;
}

.fav-chips {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  flex: 1;
}

.fav-chip {
  padding: 3px 9px;
  font-size: 11px;
  cursor: pointer;
  border: 1px solid #2a2a2a;
  border-radius: 20px;
  background: #1a1a1a;
  color: #888;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  user-select: none;
  transition:
    background 0.15s ease,
    color 0.15s ease,
    border-color 0.15s ease;
}

.fav-chip:hover {
  background: #222;
  color: #ccc;
}

.fav-chip.live {
  background: rgba(83,252,24,0.1);
  border-color: #5aff2f;
  color: #5aff2f;
}

.fav-auto {
  appearance: none;
  width: 11px;
  height: 11px;
  border: 2px solid #888;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  margin-right: 4px;
  background: #1a1a1a;
  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}

.fav-auto:hover {
  border-color: #5aff2f;
  box-shadow: 0 0 6px #5aff2f55;
}

.fav-auto:checked {
  border-color: #5aff2f;
  box-shadow: 0 0 6px #5aff2f88;
}

.fav-auto:checked::after {
  content: "";
  position: absolute;
  inset: 2px;
  background: #5aff2f;
  border-radius: 50%;
}

.fav-add-btn {
  padding: 3px 8px;
  font-size: 11px;
  cursor: pointer;
  border: 1px solid #5aff2f;
  border-radius: 5px;
  background: transparent;
  color: #5aff2f;
  white-space: nowrap;
  transition: background 0.15s ease;
}

.fav-add-btn:hover {
  background: #0f2a00;
}

/* ───────────────────────────────────────────── */
/* GRID */
/* ───────────────────────────────────────────── */

#grid {
  flex: 1;
  display: grid;
  gap: 8px;
  padding: 8px;
  min-height: 0;
  overflow: hidden;
}

.stream-grid.streams-1 {
  grid-template-columns: 1fr;
}

.stream-grid.streams-2 {
  grid-template-columns: repeat(2, 1fr);
}

.stream-grid.streams-3 {
  grid-template-columns: repeat(3, 1fr);
}

.stream-grid.streams-4 {
  grid-template-columns: repeat(2, 1fr);
}

.stream-grid.streams-5,
.stream-grid.streams-6,
.stream-grid.streams-7,
.stream-grid.streams-8,
.stream-grid.streams-9 {
  grid-template-columns: repeat(3, 1fr);
}

/* ───────────────────────────────────────────── */
/* SLOT */
/* ───────────────────────────────────────────── */

.slot {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;

  background: #141414;
  border: 1px solid #222;
  border-radius: 6px;

  user-select: none;

  opacity: 0;
  animation: slotFadeIn 0.25s ease forwards;
}

@keyframes slotFadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.slot::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 40px;
  background: linear-gradient(to top, rgba(0,0,0,0.45), transparent);
  pointer-events: none;
}

.slot.zoomed {
  position: fixed;
  inset: 0;
  z-index: 1000;
  border-radius: 0;
  border: none;
  box-shadow: 0 0 12px #5aff2f66;
}

.slot.dragging {
  opacity: 0.35;
  border: 1px dashed #5aff2f;
}

.slot.drag-over::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 2px dashed #5aff2f;
  border-radius: 6px;
  pointer-events: none;
  z-index: 100;
}

/* ───────────────────────────────────────────── */
/* SLOT BODY */
/* ───────────────────────────────────────────── */

.slot-body {
  flex: 1;
  display: flex;
  flex-direction: row;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

/* ───────────────────────────────────────────── */
/* VIDEO AREA */
/* ───────────────────────────────────────────── */

.frame-area {
  flex: 1;
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
}

/* ───────────────────────────────────────────── */
/* STREAM */
/* ───────────────────────────────────────────── */

.stream-frame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  aspect-ratio: 16 / 9;
  pointer-events: none;
}

/* ───────────────────────────────────────────── */
/* CHAT PANEL */
/* ───────────────────────────────────────────── */

.chat-panel {
  width: 0;
  min-width: 0;
  min-height: 0;

  overflow: hidden;
  flex-shrink: 0;

  display: flex;
  flex-direction: column;

  background: #0d0d0d;
  border-left: none;

  transition:
    width 0.2s ease,
    border-color 0.2s ease;
}

.chat-panel.open {
  width: 220px;
  border-left: 1px solid #2a2a2a;
}

.chat-panel iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  flex: 1;
  pointer-events: auto;
}

/* ───────────────────────────────────────────── */
/* PLACEHOLDER */
/* ───────────────────────────────────────────── */

.placeholder-wrap {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;
}

.placeholder-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.placeholder-circle {
  width: 64px;
  height: 64px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  background: #1a1a1a;
  border: 1px solid #333;

  font-size: 20px;
  font-weight: bold;
  color: #5aff2f;
}

.placeholder-label {
  font-size: 14px;
  color: #bbb;
}

/* ───────────────────────────────────────────── */
/* OVERLAYS */
/* ───────────────────────────────────────────── */

.overlay-left {
  position: absolute;
  top: 6px;
  left: 6px;
  z-index: 10;

  display: flex;
  flex-direction: column;
  gap: 4px;
}

.overlay-right {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 10;

  display: flex;
  align-items: center;
  gap: 6px;
}

.live-badge,
.viewers-badge {
  font-size: 10px;
  border-radius: 4px;
  backdrop-filter: blur(2px);
}

.live-badge {
  padding: 2px 8px;
  min-width: 48px;
  text-align: center;

  border: 1px solid #333;
  background: rgba(0,0,0,0.65);
  color: #888;
}

.live-badge.live {
  color: #5aff2f;
  border-color: #5aff2f;
  background: rgba(90,255,47,0.12);
}

.live-badge.offline {
  color: #888;
}

.viewers-badge {
  padding: 2px 7px;
  border: 1px solid #333;
  background: rgba(0,0,0,0.7);
  color: #888;
  display: none;
}

.viewers-badge.visible {
  display: block;
}

/* ───────────────────────────────────────────── */
/* OVERLAY BUTTONS */
/* ───────────────────────────────────────────── */

.overlay-btn {
  width: 28px;
  height: 28px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 5px;
  border: 1px solid #888;

  background: rgba(0,0,0,0.65);
  color: #ccc;

  font-size: 16px;
  cursor: pointer;

  transition: all 0.15s ease;
}

.overlay-btn:hover {
  background: rgba(255,255,255,0.12);
  color: #fff;
}

.zoom-btn {
  color: #5aff2f;
  border-color: #5aff2f;
}

.zoom-btn:hover {
  background: rgba(83,252,24,0.18);
}

.close-btn {
  color: #ff4d4d;
  border-color: #ff4d4d;
}

.close-btn:hover {
  background: rgba(255,0,0,0.18);
}

/* ───────────────────────────────────────────── */
/* BOTTOM BAR */
/* ───────────────────────────────────────────── */

.bar {
  display: flex;
  align-items: center;
  gap: 4px;

  padding: 5px 6px;

  background: #0f0f0f;
  border-top: 1px solid #1e1e1e;

  flex-shrink: 0;
}

.ch-label {
  display: flex;
  align-items: center;
  gap: 4px;

  max-width: min(140px, 25%);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  padding: 2px 4px;
  border-radius: 4px;

  font-size: 11px;
  font-weight: 600;

  color: #5aff2f;
  cursor: pointer;

  transition:
    color 0.15s ease,
    background 0.15s ease;
}

.ch-label:hover {
  color: #7aff3a;
  background: rgba(90,255,47,0.08);
}

.link-icon {
  font-size: 12px;
  opacity: 0.7;
}

/* ───────────────────────────────────────────── */
/* INPUTS */
/* ───────────────────────────────────────────── */

.bar input {
  height: 24px;

  padding: 2px 6px;

  border-radius: 4px;
  border: 1px solid #2a2a2a;

  background: #1a1a1a;
  color: #ddd;

  font-size: 11px;

  outline: none;

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}

.bar input:focus {
  border-color: #5aff2f;
  box-shadow: 0 0 6px #5aff2f55;
}

/* ───────────────────────────────────────────── */
/* BUTTONS */
/* ───────────────────────────────────────────── */

.bar button,
.mute-btn {
  height: 24px;

  padding: 0 10px;

  display: flex;
  align-items: center;

  border-radius: 4px;
  border: 1px solid #333;

  background: #1a1a1a;
  color: #aaa;

  font-size: 11px;
  cursor: pointer;

  transition:
    background 0.15s ease,
    color 0.15s ease,
    box-shadow 0.15s ease;
}

.bar button:hover:not(.mute-btn) {
  background: #222;
  color: #fff;
}

.bar button.primary {
  background: #5aff2f;
  color: #0a0a0a;
  border-color: #5aff2f;
  font-weight: 600;
}

.chat-btn {
  margin-left: auto;
}

.chat-btn.active {
  color: #5aff2f;
  border-color: #5aff2f;
}

.mute-btn.active {
  background: rgba(255,60,60,0.12);
  border-color: #ff4d4d;
  color: #ff4d4d;
}

/* ───────────────────────────────────────────── */
/* FOOTER */
/* ───────────────────────────────────────────── */

.footer-overlay {
  flex-shrink: 0;

  text-align: center;
  font-size: 12px;
  color: #777;

  background: rgba(10,10,10,0.9);
  border-top: 1px solid #222;

  padding: 6px 0;
}

.footer-overlay a {
  color: #5aff2f;
  text-decoration: none;
}

.footer-sep {
  margin: 0 6px;
  color: #555;
}

/* ───────────────────────────────────────────── */
/* DIALOGS */
/* ───────────────────────────────────────────── */

.add-dialog,
.about-overlay {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,0.7);

  z-index: 9999;
}

.add-dialog.hidden,
.about-overlay.hidden {
  display: none;
}

.add-dialog-content,
.about-dialog {
  width: min(320px, 90vw);

  padding: 20px;

  border-radius: 8px;
  border: 1px solid #333;

  background: #111;
  color: #eee;
}

.add-dialog-content h2,
.about-dialog h2 {
  margin-bottom: 12px;
  color: #5aff2f;
}

#dialogChannelInput {
  width: 100%;
  margin-bottom: 12px;
  padding: 10px;

  border-radius: 6px;
  border: 1px solid #444;

  background: #1a1a1a;
  color: #fff;
}

#dialogLoadBtn,
#dialogCloseBtn,
.about-dialog button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;

  border: none;
  border-radius: 6px;

  cursor: pointer;
}

#dialogLoadBtn {
  background: #5aff2f;
  color: #0a0a0a;
  font-weight: bold;
}

#dialogCloseBtn,
.about-dialog button {
  background: #333;
  color: #ccc;
}

/* ───────────────────────────────────────────── */
/* DRAGGING */
/* ───────────────────────────────────────────── */

.dragging-active iframe {
  pointer-events: none !important;
}

/* ───────────────────────────────────────────── */
/* RESPONSIVE */
/* ───────────────────────────────────────────── */

@media (max-width: 1200px) {

  .stream-grid {
    grid-template-columns: 1fr !important;
  }

  .slot {
    width: 95%;
    margin: 0 auto;
  }

  .chat-panel.open {
    width: 200px;
  }
}

@media (max-width: 768px) {

  .slot:nth-child(n+4) {
    display: none;
  }

  .stream-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .slot {
    width: 100%;
    min-height: 200px;
    max-height: 300px;
  }

  .chat-panel.open {
    width: 150px;
  }

  .overlay-btn {
    min-width: 40px;
    min-height: 40px;
  }

  .lbtn:nth-child(n+4) {
    display: none;
  }

  body {
    touch-action: pan-y pinch-zoom;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .stream-frame {
    pointer-events: auto;
  }
}
</style>

</head>

<div id="grid"></div>

<script>
// Sovelluksen metatiedot
const APP_META = {
  name: "Kick Multistream",
  version: "1.1.0",
  buildDate: "2026-04-29", // Päivitetty versio ja päiväys[cite: 1]
  author: "Toni",
  repo: "https://github.com/ipappa74/kick-multistream",
  homepage: "https://ipappa74.github.io/kick-multistream/"
};

  // Käyttäjäseuranta
  const analytics = {
    getUserId: () => {
      let userId = localStorage.getItem('kick-multistream-user-id');
      if (!userId) {
        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('kick-multistream-user-id', userId);
        console.log(`%cUusi käyttäjä: ${userId}`, 'color: #5aff2f; font-weight: bold;');
      }
      return userId;
    },
    
    trackVisit: () => {
      const userId = analytics.getUserId();
      const visitCount = parseInt(localStorage.getItem('kick-multistream-visit-count') || '0') + 1;
      localStorage.setItem('kick-multistream-visit-count', visitCount.toString());
      
      const uniqueUsers = parseInt(localStorage.getItem('kick-multistream-unique-users') || '0');
      const isFirstVisit = visitCount === 1;
      
      if (isFirstVisit) {
        localStorage.setItem('kick-multistream-unique-users', (uniqueUsers + 1).toString());
        console.log(`%cUniikit käyttäjät: ${uniqueUsers + 1}`, 'color: #5aff2f; font-weight: bold;');
      }
      
      console.log(`%cKäyttäjä: ${userId} | Käynnit: ${visitCount} | Laite: ${analytics.getDeviceType()}`, 
                  'color: #888; font-size: 12px;');
      
      return { userId, visitCount, isFirstVisit, uniqueUsers: uniqueUsers + 1 };
    },
    
    getDeviceType: () => {
      const ua = navigator.userAgent;
      if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) || window.innerWidth <= 768) {
        return 'Mobiili';
      }
      return 'Desktop';
    },
    
    getStats: () => {
      const uniqueUsers = localStorage.getItem('kick-multistream-unique-users') || '0';
      const totalVisits = localStorage.getItem('kick-multistream-visit-count') || '0';
      return {
        uniqueUsers: parseInt(uniqueUsers),
        totalVisits: parseInt(totalVisits)
      };
    }
  };
  
  console.log(`${APP_META.name} v${APP_META.version} - ${APP_META.buildDate}`);
  
  // Seuranta käynnistys
  const visitData = analytics.trackVisit();
  
  // Näytä yleiskatsaus tilastoista
  console.log(`%c=== KICK MULTISTREAM TILASTOT ===`, 'color: #5aff2f; font-weight: bold; font-size: 14px;');
  console.log(`%cUniikit käyttäjät: ${visitData.uniqueUsers}`, 'color: #5aff2f; font-weight: bold;');
  console.log(`%cKokonaiskäynnit: ${visitData.visitCount}`, 'color: #888; font-weight: bold;');
  console.log(`%cNykyinen laite: ${analytics.getDeviceType()}`, 'color: #888; font-weight: bold;');
  console.log(`%c================================`, 'color: #5aff2f; font-weight: bold; font-size: 14px;');

  // Mobiililaitteen tunnistus
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
  
  // --- GLOBAALIT MUUTTUJAT ---
  const MAX = isMobile ? 3 : 9; 
  let count = 1;
  let zoomedSlot = -1;
  const channels  = Array(MAX).fill('');
  let muted      = Array(MAX).fill(true);
  const chatOpen  = Array(MAX).fill(false);
  const liveStatus = {};
  const viewers    = {};
  let selectedSlot = null;
  let favorites = JSON.parse(localStorage.getItem('kick-favs') || '[]');
  let autoLoadChannels = JSON.parse(localStorage.getItem('kick-auto-load-channels') || '{}');
  let dragSrcIndex = null;

  // --- TAPAHTUMIEN DELEGOINTI (UUSI) ---[cite: 1]
  const grid = document.getElementById('grid');

  grid.addEventListener('dragstart', (e) => {
    const slot = e.target.closest('.slot');
    if (!slot) return;
    dragSrcIndex = Number(slot.dataset.index);
    slot.classList.add("dragging");
    document.body.classList.add("dragging-active"); // Estää iframen hiiriongelmat[cite: 1]
    e.dataTransfer.effectAllowed = "move";
  });

  grid.addEventListener('dragover', (e) => {
    e.preventDefault();
    const slot = e.target.closest('.slot');
    if (slot) slot.classList.add("drag-over");
  });

  grid.addEventListener('dragleave', (e) => {
    const slot = e.target.closest('.slot');
    if (slot) slot.classList.remove("drag-over");
  });

  grid.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove("dragging-active");
    const slot = e.target.closest('.slot');
    if (!slot) return;
    
    slot.classList.remove("drag-over");
    const targetIndex = Number(slot.dataset.index);
    
    if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
      swapSlots(dragSrcIndex, targetIndex);
      renderGrid();
    }
  });

  grid.addEventListener('dragend', (e) => {
    const slot = e.target.closest('.slot');
    if (slot) slot.classList.remove("dragging");
    document.body.classList.remove("dragging-active");
  });

  // Lataa tila heti alustuksen jälkeen
  loadState();

  /* ===== DIALOG (UNIFIED) ===== */

  function openDialog(slot, mode){
    selectedSlot = slot;
    dialogMode = mode;
    const title = document.getElementById('dialogTitle') || document.querySelector('.add-dialog-content h2');
    const loadBtn = document.getElementById('dialogLoadBtn');
    const input = document.getElementById('dialogChannelInput');
    
    if (mode === 'favorite') {
    if (title) title.textContent = 'Lisää suosikki';
    if (loadBtn) loadBtn.textContent = 'Lisää';
    if (input) input.placeholder = 'Kanavan nimi suosikiksi';
    } else {
    if (title) title.textContent = 'Lisää striimi';
    if (loadBtn) loadBtn.textContent = 'Lataa';
    if (input) input.placeholder = 'Kanavan nimi';
    }
    
    document.getElementById('addStreamDialog').classList.remove('hidden');
  }

  function closeDialog(){
    document.getElementById('addStreamDialog').classList.add('hidden');
    document.getElementById('dialogChannelInput').value = '';
  }

  document.getElementById('dialogLoadBtn').onclick = () => {
    const val = document.getElementById('dialogChannelInput').value.trim();
    if(!val) return;

    if(dialogMode === 'stream'){
    channels[selectedSlot] = val;
    if (muted[selectedSlot] === undefined) muted[selectedSlot] = true;
    } else if (dialogMode === 'favorite') {
    const ch = val.toLowerCase().replace(/^@/, '');
    if (ch && !favorites.includes(ch)) {
      favorites.push(ch);
      localStorage.setItem('kick-favs', JSON.stringify(favorites));
      checkLiveFavOnly(ch);
      renderFavorites();
    }
    }

    saveState();
    render();
    closeDialog();
  };

  document.getElementById('dialogCloseBtn').onclick = closeDialog;

  function saveState() {
    const state = {
      count,
      channels: channels.slice(0, MAX),
      muted: muted.slice(0, MAX),
      chatOpen: chatOpen.slice(0, MAX)
    };
    localStorage.setItem('kick-state', JSON.stringify(state));
  }

  function openAbout() {
    const overlay = document.getElementById("aboutOverlay");
    const ver = document.getElementById("aboutVersion");
    if (ver && APP_META) {
    ver.textContent = `Versio: ${APP_META.version} (${APP_META.buildDate})`;
    }
    overlay.classList.remove("hidden");
  }

  function closeAbout() {
    document.getElementById("aboutOverlay").classList.add("hidden");
  }

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem('kick-state') || 'null');
      for (let i = 0; i < MAX; i++) {
        muted[i] = true;
        channels[i] = '';
        chatOpen[i] = false;
      }
      if (!s) return;
      count = s.count || 1;
      if (s.channels) s.channels.forEach((ch, i) => { if (ch !== undefined) channels[i] = ch; });
      if (s.muted) s.muted.forEach((m, i) => { if (m !== undefined) muted[i] = m; });
      if (s.chatOpen) s.chatOpen.forEach((open, i) => { if (open !== undefined) chatOpen[i] = open; });
    } catch(e) {
      for (let i = 0; i < MAX; i++) {
        muted[i] = true;
        channels[i] = '';
        chatOpen[i] = false;
      }
    }
  }

  const layoutMap = { 1:1, 2:2, 3:3, 4:4, 6:6, 9:9 };

  function setLayout(n) {
    count = layoutMap[n] || n;
    saveState();
    document.querySelectorAll('.lbtn').forEach((b, i) => {
    b.classList.toggle('active', [1,2,3,4,6,9][i] === n);
    });
    renderGrid();
  }

  function buildSlot(i) {
    const ch = channels[i] || '';
    const isMuted = muted[i] !== false; 
    const isChat  = chatOpen[i];
    const isLive  = ch ? liveStatus[ch] : null;
    const vc      = ch && viewers[ch] != null ? viewers[ch].toLocaleString('fi-FI') : null;

    const overlays = ch ? `
      <div class="overlay-left">
        <div class="live-badge ${isLive === true ? 'live' : isLive === false ? 'offline' : ''}" id="livebadge-${i}">
          ${isLive === true ? 'LIVE' : isLive === false ? 'OFFLINE' : ''}
        </div>
        <div class="viewers-badge ${vc != null ? 'visible' : ''}" id="viewers-${i}">
          ${vc != null ? vc + ' katsojaa' : ''}
        </div>
      </div>
      <div class="overlay-right">
        <button class="overlay-btn close-btn" onclick="closeSlot(${i})" title="Sulje striimi">✕</button>
        <button class="overlay-btn zoom-btn" onclick="toggleZoom(${i})" title="${zoomedSlot === i ? 'Sulje suurennos' : 'Suurenna striimi'}">
          ${zoomedSlot === i ? '−' : '+'}
        </button>
      </div>
    ` : '';

    const frameContent = ch
      ? `<iframe class="stream-frame" src="https://player.kick.com/${ch}?autoplay=true&muted=${isMuted}" allowfullscreen allow="autoplay; encrypted-media; fullscreen" loading="lazy"></iframe>
         ${overlays}`
      : `
        <div class="placeholder-wrap" onclick="addStreamAt(${i})" style="cursor: pointer;">
          <div class="placeholder-content">
            <div class="placeholder-circle">+</div>
            <div class="placeholder-label">Lisää striimi</div>
          </div>
        </div>
      `;

    const chatContent = ch
      ? `<div class="chat-panel ${isChat ? 'open' : ''}" id="chat-${i}">
           <iframe src="${isChat ? `https://kick.com/${ch}/chatroom` : 'about:blank'}" id="chat-iframe-${i}" allowfullscreen></iframe>
         </div>` : '';

    return `
      <div class="slot-body">
        <div class="frame-area" id="fa-${i}">${frameContent}</div>
        ${chatContent}
      </div>
      <div class="bar">
        ${ch ? `<span class="ch-label" onclick="openTab(${i})">${ch}<span class="link-icon">↗</span></span>` : ''}
        ${ch ? `
        <button class="chat-btn ${isChat ? 'active' : ''}" id="chatbtn-${i}" onclick="toggleChat(${i})">Chat</button>
        <button class="mute-btn ${isMuted ? 'active' : ''}" onclick="toggleMute(${i})">
          ${isMuted ? 'Unmute' : 'Mute'}
        </button>
        ` : ''}
      </div>
    `;
  }

	function renderGrid() {
	  grid.className = `stream-grid streams-${count}`;
	  
	  // Poistetaan ylimääräiset slotit vain lopusta, jos count on pienentynyt
	  while (grid.children.length > count) {
		grid.removeChild(grid.lastChild);
	  }

	  for (let i = 0; i < count; i++) {
		let slot = document.getElementById('slot-' + i);
		const channelAtSlot = channels[i] || '';
		
		if (!slot) {
		  // Luo uusi slot vain jos sitä ei ole olemassa
		  slot = document.createElement('div');
		  slot.className = 'slot';
		  slot.id = 'slot-' + i;
		  slot.setAttribute("draggable", "true");
		  slot.dataset.index = i;
		  slot.dataset.channel = channelAtSlot;
		  slot.innerHTML = buildSlot(i);
		  grid.appendChild(slot);
		} else {
		  // PÄIVITYS: Jos kanava on vaihtunut, päivitä sisältö
		  if (slot.dataset.channel !== channelAtSlot) {
			slot.innerHTML = buildSlot(i);
			slot.dataset.channel = channelAtSlot;
		  }
		  // Päivitä vain zoom-luokka, älä lataa iframea uudelleen
		  slot.classList.toggle('zoomed', zoomedSlot === i);
		}
	  }
	}

  function load(i, ch) {
    const inp = document.getElementById('inp-' + i);
    const channel = (ch !== undefined ? ch : inp.value).trim().toLowerCase().replace(/^@/, '');
    if (inp) inp.value = channel;
    channels[i] = channel;
    if (muted[i] === undefined) muted[i] = true;
    chatOpen[i] = false;
    saveState();
    const slot = document.getElementById('slot-' + i);
    if (slot) {
      slot.innerHTML = buildSlot(i);
      slot.dataset.channel = channel;
    }
    if (channel) checkLive(channel, i);
  }

	function toggleMute(i) {
	  // Vaihdetaan tila (true/false) ja tallennetaan se paikallisesti
	  muted[i] = !muted[i]; 
	  saveState();

	  const ch = channels[i];
	  if (!ch) return;

	  const iframe = document.querySelector(`#slot-${i} .stream-frame`);
	  if (iframe) {
		// Päivitetään iframe uudella muted-parametrilla
		iframe.src = `https://player.kick.com/${ch}?autoplay=true&muted=${muted[i]}`;
	  }

	  const muteBtn = document.querySelector(`#slot-${i} .mute-btn`);
	  if (muteBtn) {
		// Päivitetään painikkeen tyyli ja teksti vastaamaan uutta tilaa
		muteBtn.classList.toggle('active', muted[i]);
		muteBtn.textContent = muted[i] ? 'Unmute' : 'Mute';
	  }
	}

  function closeSlot(i) {
    channels[i] = '';
    chatOpen[i] = false;
    saveState();
    const slot = document.getElementById('slot-' + i);
    if (slot) {
      slot.innerHTML = buildSlot(i);
      slot.dataset.channel = '';
    }
  }

  function toggleZoom(i) {
    zoomedSlot = (zoomedSlot === i) ? -1 : i;
    document.querySelectorAll('.slot').forEach((slot, idx) => {
      slot.classList.toggle('zoomed', idx === zoomedSlot);
      const btn = slot.querySelector('.zoom-btn');
      if (btn && idx === i) btn.textContent = (zoomedSlot === idx) ? '−' : '+';
    });
  }

  function toggleChat(i) {
    chatOpen[i] = !chatOpen[i];
    saveState();
    const panel = document.getElementById('chat-' + i);
    const btn   = document.getElementById('chatbtn-' + i);
    if (!panel) return;
    panel.classList.toggle('open', chatOpen[i]);
    if (btn) btn.classList.toggle('active', chatOpen[i]);
    if (chatOpen[i]) {
      const iframe = document.getElementById('chat-iframe-' + i);
      const ch = channels[i];
      if (iframe && iframe.src === 'about:blank' && ch) iframe.src = `https://kick.com/${ch}/chatroom`;
    }
  }

  function openTab(i) {
    const ch = channels[i];
    if (ch) window.open('https://kick.com/' + ch, '_blank');
  }

  async function checkLive(ch, slotIndex) {
    if (!ch) return;
    try {
      const res = await fetch(`https://kick.com/api/v1/channels/${ch}`, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) return;
      const data = await res.json();
      const isLive = !!(data.livestream && data.livestream.is_live);
      liveStatus[ch] = isLive;
      viewers[ch] = isLive ? data.livestream.viewer_count : null;

      if (slotIndex !== undefined) {
        const badge = document.getElementById('livebadge-' + slotIndex);
        if (badge) {
          badge.className = 'live-badge ' + (isLive ? 'live' : 'offline');
          badge.textContent = isLive ? 'LIVE' : 'OFFLINE';
        }
        const vEl = document.getElementById('viewers-' + slotIndex);
        if (vEl) {
          vEl.className = isLive ? 'viewers-badge visible' : 'viewers-badge';
          vEl.textContent = isLive ? viewers[ch].toLocaleString('fi-FI') + ' katsojaa' : '';
        }
      }
      updateFavoriteChips();
    } catch(e) {}
  }

  async function checkLiveFavOnly(ch) {
    if (!ch) return;
    try {
      const res = await fetch(`https://kick.com/api/v1/channels/${ch}`, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) return;
      const data = await res.json();
      const wasLive = liveStatus[ch] === true;
      const isLive = !!(data.livestream && data.livestream.is_live);
      liveStatus[ch] = isLive;

      if (autoLoadChannels[ch] === true && isLive && !wasLive) {
        const loaded = channels.slice(0, count);
        if (!loaded.includes(ch)) {
          let target = loaded.indexOf('');
          if (target === -1) target = 0;
          load(target, ch);
        }
      }
      updateFavoriteChips();
    } catch(e) {}
  }

  async function checkAllLive() {
    for (let i = 0; i < count; i++) {
      if (channels[i]) {
        await checkLive(channels[i], i);
        await new Promise(r => setTimeout(r, 500)); // Rate-limiting[cite: 1]
      }
    }
    for (const fav of favorites) {
      if (!channels.slice(0, count).includes(fav)) {
        await checkLiveFavOnly(fav);
        await new Promise(r => setTimeout(r, 300));
      }
    }
  }

  function renderFavorites() {
    const chips = document.getElementById('fav-chips');
    if (!chips) return;
    chips.innerHTML = '';
    const sorted = [...favorites].sort((a, b) => (liveStatus[b] === true ? 1 : 0) - (liveStatus[a] === true ? 1 : 0));
    sorted.forEach((fav) => {
      const isLive = liveStatus[fav];
      const auto = autoLoadChannels[fav] === true;
      const chip = document.createElement('span');
      chip.className = 'fav-chip' + (isLive ? ' live' : '');
      chip.innerHTML = `<input type="checkbox" class="fav-auto" data-ch="${fav}" ${auto ? 'checked' : ''}><span>${fav}</span>`;
      chip.onclick = (e) => { if (!e.target.classList.contains('fav-auto')) loadFavoriteToSlot(fav); };
      chip.oncontextmenu = (e) => { e.preventDefault(); removeFavorite(favorites.indexOf(fav)); };
      chips.appendChild(chip);
    });
    document.querySelectorAll('.fav-auto').forEach(cb => {
      cb.addEventListener('change', (e) => {
        autoLoadChannels[e.target.dataset.ch] = e.target.checked;
        localStorage.setItem('kick-auto-load-channels', JSON.stringify(autoLoadChannels));
      });
    });
  }

  function updateFavoriteChips() { renderFavorites(); }
  function addFavorite() { openDialog(null, 'favorite'); }
  function addStreamAt(i) { openDialog(i, 'stream'); }
  function removeFavorite(fi) { favorites.splice(fi, 1); localStorage.setItem('kick-favs', JSON.stringify(favorites)); renderFavorites(); }
  function loadFavoriteToSlot(ch) { let target = channels.slice(0, count).indexOf(''); if (target === -1) target = 0; load(target, ch); }

  function swapSlots(a, b) {
    [channels[a], channels[b]] = [channels[b], channels[a]];
    [muted[a], muted[b]] = [muted[b], muted[a]];
    [chatOpen[a], chatOpen[b]] = [chatOpen[b], chatOpen[a]];
    saveState();
  }

  function render() { renderGrid(); }

  // Alustus
  renderFavorites();
  renderGrid();
  loadState();
  checkAllLive(); 

  // Pidennetty tarkistusväli (60s) resurssien säästämiseksi[cite: 1]
  setInterval(checkAllLive, 60000);

  // Mobiili-äänitoiston tuki
  if (isMobile) {
    const enableAudio = () => {
      document.querySelectorAll('.stream-frame').forEach(iframe => {
        try { if (iframe.contentWindow) iframe.contentWindow.postMessage({ action: 'enableAudio' }, '*'); } catch (e) {}
      });
    };
    document.addEventListener('click', enableAudio, { once: true });
    document.addEventListener('touchstart', enableAudio, { once: true });
  }
</script>
</body>
</html>
